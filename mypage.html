<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이페이지</title>
    <link rel="stylesheet" href="./style1.css" type="text/css">
    <link rel="stylesheet" href="./mycss.css" type="text/css">
</head>
<body>
    <div class="navbar_section">
        <div class="navbar_main">
            <a class="navbar_logo" href="/">로고</a>
            <div class="navbar_links">
                <a href="/gameselect.html">Game</a>
                <a href="/Rule.html">Rule</a>
                <a href="/login.html">Login</a>
                <a href="/register.html">Register</a>
                <a href="/mypage">My Page</a>
                <a href="/ranking">Ranking</a>
            </div>
        </div>
    </div>

    <br>
    <br>

    <h1>마이페이지</h1>
    <h2>사용자 정보</h2>
    <table class="user-info-table">
        <tr>
            <th>항목</th>
            <th>값</th>
        </tr>
        <tr>
            <td>사용자 ID</td>
            <td><span id="userId"><%= userData.id %></span></td>
        </tr>
        <tr>
            <td>이메일</td>
            <td><span id="email"><%= userData.email %></span></td>
        </tr>
        <tr>
            <td>UID</td>
            <td><span id="uid"><%= userData.uid %></span></td>
        </tr>
        <tr>
            <td>승리 횟수</td>
            <td><span id="wincount"><%= userData.wincount %></span></td>
        </tr>
        <tr>
            <td>패배 횟수</td>
            <td><span id="losecount"><%= userData.losecount %></span></td>
        </tr>
        <tr>
            <td>승률</td>
            <td><span id="rate"><%= userData.rate %></span></td>
        </tr>
        <tr>
            <td>플레이 횟수</td>
            <td><span id="playcount"><%= userData.playcount %></span></td>
        </tr>
    </table>

    <h2>게임 데이터</h2>
    <div id="gameDataContainer"></div>

    <script>
        const gameData = <%= JSON.stringify(games) %>;
        const gameDataContainer = document.getElementById('gameDataContainer');

        if (Array.isArray(gameData) && gameData.length > 0) {
            gameData.forEach(game => {
                const gameDiv = document.createElement('div');
                gameDiv.className = 'game-data';
                gameDiv.innerHTML = `
                    <p>게임 ID: ${game.game_id}</p>
                    <p>점수: ${game.score}</p>
                    <hr>
                `;
                gameDataContainer.appendChild(gameDiv);
            });
        } else {
            gameDataContainer.innerHTML = "<p>게임 데이터를 불러올 수 없습니다.</p>";
        }
    </script>

</body>
</html>
