        <!-- Registration Form Section -->
        <div class="form_section">
            <div class="container">
                <h1>회원가입</h1>
                <form action="./auth/register_process" method="post">
                    <label for="username">유저이름</label>
                    <input type="text" id="username" name="username" placeholder="유저이름">
                    <label for="pwd">비밀번호</label>
                    <input type="password" id="pwd" name="pwd" placeholder="비밀번호">
                    <label for="pwd2">비밀번호 재확인</label>
                    <input type="password" id="pwd2" name="pwd2" placeholder="비밀번호 재확인">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" placeholder="이메일">
                    <input type="submit" value="제출">
                </form>
                <p><a class="link" href="./login.html">로그인 화면으로 돌아가기</a></p>
            </div>
        </div>
    </body>
